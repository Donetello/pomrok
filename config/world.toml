victory = "Олекса назвав це уроком. Сказав, що найкращі уроки ті, за які платить учитель."
defeat = "Олекса подав руку й запросив до столу. Миску тримав так, що й шаблею не виб’єш."
[bot.opponent]
name = "Олекса Ремінь"
hp = 39

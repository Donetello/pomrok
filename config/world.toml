[story]
title = "Куди подівся світанок"
hook = "Темрява прихопила світанок. У селі це помітили, коли півень зажадав плати за нічну зміну."
prologue = [
  "Колись на Чорногорі світло й темрява ділили добу навпіл. Узимку темрява брала трохи більше, зате ніколи не спізнювалася. А цієї ночі від ранку лишилася записка на дверях дзвіниці: «Вилучено до з’ясування обставин».",
  "Громада вирішила повернути світанок. Староста викликав добровольців, тобто прочитав список тих, хто не встиг вийти з корчми. Дорога до застави пана Помрока йде через дзвіницю та туманну ґать. Візьми зброю й скриньку з кульками. Печатку, якщо до неї дійде, позичиш у темряви.",
]

[[heroes]]
id = "vanguard"
name = "Щитник"
description = "Носить дубовий щит. Дуб, за словами щитника, був не проти."
mark = "shield"
hp = 43
attack = 9
armor = 3
speed = 2

[[heroes]]
id = "duelist"
name = "Легінь"
description = "Швидкий на ноги й на шаблю. На обіцянки ще швидший."
mark = "swords"
hp = 35
attack = 10
armor = 2
speed = 5

[[heroes]]
id = "hexblade"
name = "Мольфар"
description = "Уміє гукнути грім. З бронею складніше: грім не любить, коли його носять."
mark = "flame"
hp = 37
attack = 12
armor = 1
speed = 3

[[dungeon]]
id = "crypt"
name = "Дзвіниця без ранку"
description = "Під дерев’яною дзвіницею сидить упир. Каже, що тримає дзвін на ремонті. Квитанція, за його словами, теж на ремонті."
difficulty = "Легко"
mark = "skull"
victory = "Дзвін озвався, і в потічку спалахнула перша смужка світла. Упир видав квитанцію. Вона, як не дивно, була в повному порядку."
defeat = "Упир зачинив дзвіницю й повісив табличку «Обід». Добре йому. Решта села ще чекає на сніданок."
[dungeon.opponent]
name = "Упир-дзвонар"
hp = 29
attack = 8
armor = 2
speed = 2

[[dungeon]]
id = "fen"
name = "Туманна ґать"
description = "Мавка перегородила шлях крізь праліс і збирає мито з кожного, хто відкидає тінь. Особливо прибуткові, каже, дні з двома сонцями."
difficulty = "Помірно"
mark = "moon"
victory = "Мавка пропустила тебе й навіть підняла туман над стежкою. Про всяк випадок порахувала це як послугу, а не поразку."
defeat = "Мавка записала бій до книги прибутків. У графі про тебе стоїть «повернеться». Оптимістка."
[dungeon.opponent]
name = "Мавка-митарка"
hp = 39
attack = 10
armor = 2
speed = 4

[[dungeon]]
id = "keep"
name = "Застава на Чорногорі"
description = "Пан Помрок тримає світанок за брамою. Без трьох печаток не випускає. Третю печатку, на його думку, поставлять ізранку."
difficulty = "Важко"
mark = "flame"
victory = "Світло покотилося з полонини аж до села. Пан Помрок записав, що світанок відбувся за його сприяння. І справді, без нього всі давно вже спали б."
defeat = "Пан Помрок підписав дозвіл і відклав до ранку. Ранок відклався разом із дозволом."
[dungeon.opponent]
name = "Пан Помрок"
hp = 49
attack = 11
armor = 3
speed = 2


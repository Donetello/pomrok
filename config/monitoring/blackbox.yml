modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      headers:
        User-Agent: Pomrok-Uptime/1
  web_arena:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      headers:
        User-Agent: Pomrok-Uptime/1
      fail_if_body_not_matches_regexp: ['id="battleground"']

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - recording-rules.yml

scrape_configs:
  - job_name: pomrok-app
    static_configs:
      - targets: ["api:9464", "web:9464"]

  - job_name: pomrok-probes
    metrics_path: /probe
    static_configs:
      - targets: ["http://api:3001/catalog"]
        labels: { probe: api, module: http_2xx, location: docker }
      - targets: ["http://api:3001/health"]
        labels: { probe: bot_readiness, module: http_2xx, location: docker }
      - targets: ["http://web:3000/"]
        labels: { probe: web_arena, module: web_arena, location: docker }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox:9115
